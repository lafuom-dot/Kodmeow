<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow Whisper Instant Chat</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #f5eedc;
            --main-color: #8b5a2b;
            --chat-bg: #fffcf7;
            --my-msg-bg: #e2f0d9;
            --other-msg-bg: #ffffff;
            --text-color: #333333;
        }

        body.theme-beige { --bg-color: #f5eedc; --main-color: #8b5a2b; --chat-bg: #fffcf7; --my-msg-bg: #e8d8c8; }
        body.theme-pastel-blue { --bg-color: #e6f0fa; --main-color: #4a7c59; --chat-bg: #f4f8fb; --my-msg-bg: #d0e1f9; }
        body.theme-mint { --bg-color: #e8f5e9; --main-color: #2e7d32; --chat-bg: #f1f8e9; --my-msg-bg: #c8e6c9; }
        body.theme-hitech { --bg-color: #eceff1; --main-color: #37474f; --chat-bg: #ffffff; --my-msg-bg: #cfd8dc; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; height: 100vh; transition: all 0.3s ease; }
        
        .app-container { width: 100%; max-width: 480px; height: 95vh; background: var(--chat-bg); display: flex; flex-direction: column; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); overflow: hidden; }
        
        .header { background: var(--main-color); color: #fff; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .title { font-weight: bold; font-size: 16px; }
        
        .controls { display: flex; gap: 6px; }
        select, button { padding: 4px 8px; border-radius: 6px; border: none; font-size: 12px; cursor: pointer; }

        .id-bar { font-size: 12px; background: rgba(255,255,255,0.2); padding: 6px 10px; border-radius: 8px; display: flex; gap: 6px; align-items: center; }
        .id-bar input { border: none; padding: 4px 8px; border-radius: 4px; flex: 1; outline: none; }
        .id-bar button { background: #fff; color: var(--main-color); font-weight: bold; }

        .chat-box { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: var(--chat-bg); }
        .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg.my { background: var(--my-msg-bg); align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.other { background: var(--other-msg-bg); align-self: flex-start; border-bottom-left-radius: 2px; }

        .footer { display: flex; padding: 10px; background: #fff; border-top: 1px solid #eee; gap: 8px; align-items: center; }
        .footer input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        .send-btn { background: var(--main-color); color: white; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 16px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="theme-beige">

<div class="app-container">
    <div class="header">
        <div class="top-bar">
            <span class="title" id="myIdDisplay">ID: ...</span>
            <div class="controls">
                <select id="langSelect" onchange="changeLanguage()">
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                    <option value="tr">Türkçe</option>
                    <option value="tt">Татарча</option>
                    <option value="ar">العربية</option>
                </select>
                <select id="themeSelect" onchange="changeTheme()">
                    <option value="theme-beige">Бежевый</option>
                    <option value="theme-pastel-blue">Пастельно-голубой</option>
                    <option value="theme-mint">Мятный</option>
                    <option value="theme-hitech">Хай-тек серый</option>
                </select>
                <select id="soundSelect">
                    <option value="meow">🐾 Мяу</option>
                    <option value="crunch">🍖 Хруст</option>
                    <option value="hiss">🐍 Шипенье</option>
                </select>
            </div>
        </div>
        <div class="id-bar">
            <span id="labelPartner">ID друга:</span>
            <input type="text" id="partnerIdInput" placeholder="mw-1234">
            <button onclick="connectToChat()" id="btnConnect">Войти</button>
        </div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="footer">
        <input type="text" id="messageInput" placeholder="Напишите сообщение...">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    // Точные настройки Firebase с европейским адресом базы
    const firebaseConfig = {
        apiKey: "AIzaSyBYP7VgXjs6eovGU8ptQignO8ha_uQCpwQ",
        authDomain: "my-cat-3db92.firebaseapp.com",
        databaseURL: "https://my-cat-3db92-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "my-cat-3db92",
        storageBucket: "my-cat-3db92.firebasestorage.app",
        messagingSenderId: "572307984373",
        appId: "1:572307984373:web:afbd346db8c6797b201abc"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Переводы интерфейса
    const translations = {
        ru: { partnerLabel: "ID друга:", connectBtn: "Войти", placeholder: "Напишите сообщение..." },
        en: { partnerLabel: "Friend ID:", connectBtn: "Connect", placeholder: "Type a message..." },
        tr: { partnerLabel: "Arkadaş ID:", connectBtn: "Bağlan", placeholder: "Mesaj yazın..." },
        tt: { partnerLabel: "Дус ID:", connectBtn: "Керү", placeholder: "Хәбәр языгыз..." },
        ar: { partnerLabel: "معرف الصديق:", connectBtn: "دخول", placeholder: "اكتب رسالة..." }
    };

    // Звуковые эффекты
    function playSound(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'meow') {
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.15);
                osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } else if (type === 'crunch') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'hiss') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(1200, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                osc.start();
                osc.stop(ctx.currentTime + 0.25);
            }
        } catch(e) {}
    }

    // Генерация/получение ID пользователя
    let myId = localStorage.getItem('mw_user_id');
    if (!myId) {
        myId = 'mw-' + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('mw_user_id', myId);
    }
    document.getElementById('myIdDisplay').innerText = 'Мой ID: ' + myId;

    let currentChatId = null;

    function changeLanguage() {
        const lang = document.getElementById('langSelect').value;
        const t = translations[lang] || translations.ru;
        document.getElementById('labelPartner').innerText = t.partnerLabel;
        document.getElementById('btnConnect').innerText = t.connectBtn;
        document.getElementById('messageInput').placeholder = t.placeholder;
    }

    function changeTheme() {
        const theme = document.getElementById('themeSelect').value;
        document.body.className = theme;
    }

    function connectToChat() {
        const partnerId = document.getElementById('partnerIdInput').value.trim();
        if (!partnerId) return alert('Введите ID!');

        currentChatId = [myId, partnerId].sort().join('_');
        const chatRef = db.ref('chats/' + currentChatId + '/messages');
        chatRef.off();

        document.getElementById('chatBox').innerHTML = '';
        chatRef.on('child_added', (snapshot) => {
            const data = snapshot.val();
            displayMessage(data.text, data.sender === myId ? 'my' : 'other');
            if (data.sender !== myId) {
                const soundType = document.getElementById('soundSelect').value;
                playSound(soundType);
            }
        });

        alert('Соединение установлено!');
    }

    function sendMessage() {
        const textInput = document.getElementById('messageInput');
        const text = textInput.value.trim();
        if (!text || !currentChatId) return;

        db.ref('chats/' + currentChatId + '/messages').push({
            sender: myId,
            text: text,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        });

        const soundType = document.getElementById('soundSelect').value;
        playSound(soundType);
        textInput.value = '';
    }

    function displayMessage(text, type) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${type}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById('messageInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
