<!DOCTYPE html>
<html lang="tt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meow Whisper Chat v8.0</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4ece4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      color: #333;
    }

    /* Основной контейнер - полная адаптивность */
    .app-container {
      width: 100%;
      max-width: 800px;
      height: 94vh;
      background: #ffffff;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      overflow: hidden;
      position: relative;
    }

    /* Верхняя панель */
    .header {
      padding: 10px 12px;
      background: #fff;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #f0e6df;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #8b5e3c;
      border: 1px solid #d7ccc8;
    }

    .nav-btn {
      padding: 8px 12px;
      border-radius: 12px;
      border: none;
      background: #f7f3f0;
      color: #4a3b32;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }

    .nav-btn.active {
      background: #8b5e3c;
      color: #fff;
    }

    .dropdown-container {
      position: relative;
      margin-left: auto;
      display: flex;
      gap: 6px;
    }

    /* Выпадающее меню открывается влево от края, чтобы не срезаться */
    .dropdown-menu {
      position: absolute;
      top: 110%;
      right: 0;
      background: #2d3142;
      color: #fff;
      border-radius: 12px;
      padding: 6px;
      display: none;
      flex-direction: column;
      min-width: 160px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    .dropdown-menu.show {
      display: flex;
    }

    .dropdown-item {
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .dropdown-item:hover {
      background: rgba(255,255,255,0.1);
    }

    /* Комната */
    .room-bar {
      padding: 8px 12px;
      background: #faf8f5;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #f0f0f0;
    }

    .room-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      outline: none;
      font-size: 13px;
      background: #fff;
    }

    .btn-action {
      padding: 8px 16px;
      background: #a07855;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }

    /* Сообщения */
    .messages-area {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-image: radial-gradient(#e5dcd3 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .message-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      position: relative;
      font-size: 14px;
      line-height: 1.4;
    }

    .message-bubble.selectable {
      cursor: pointer;
    }

    .message-bubble.selected {
      border: 2px solid #a07855;
      background: #fdfaf7;
    }

    .message-bubble.out {
      align-self: flex-end;
      background: #e8f5e9;
    }

    .message-img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 5px;
      display: block;
    }

    /* Панель пакетного сохранения/пересылки */
    .batch-actions-bar {
      padding: 8px 12px;
      background: #eef2f5;
      display: none;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #d0d7de;
    }

    .batch-actions-bar.show {
      display: flex;
    }

    /* Нижняя панель */
    .input-bar {
      padding: 10px 12px;
      background: #fff;
      border-top: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: #f5f0eb;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }

    .chat-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 20px;
      outline: none;
      font-size: 14px;
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #a07855;
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    /* Темы оформления */
    body.theme-dark .app-container { background: #1e1e1e; color: #fff; }
    body.theme-dark .header, body.theme-dark .input-bar, body.theme-dark .room-bar { background: #252525; border-color: #333; }
    body.theme-dark .message-bubble { background: #333; color: #fff; }
    body.theme-dark .chat-input, body.theme-dark .room-input { background: #2c2c2c; color: #fff; border-color: #444; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Верхняя шапка -->
  <div class="header">
    <div class="avatar">🐱</div>
    <button class="nav-btn active" id="btn-trader">Трейдер</button>
    <button class="nav-btn" id="btn-chats">Чатлар</button>
    <button class="nav-btn" id="btn-notes">Язмалар</button>

    <div class="dropdown-container">
      <!-- Звуковое меню -->
      <button class="icon-btn" id="sound-menu-toggle" title="Звуки">🔔</button>
      <div class="dropdown-menu" id="sound-dropdown">
        <div class="dropdown-item" onclick="setSound('meow')">🐱 Мяуканье</div>
        <div class="dropdown-item" onclick="setSound('purr')">🐾 Мурчание</div>
        <div class="dropdown-item" onclick="setSound('pop')">🎈 Щелчок</div>
        <div class="dropdown-item" onclick="setSound('mute')">🔇 Без звука</div>
      </div>

      <!-- Переключатель языка -->
      <button class="nav-btn" id="lang-toggle">TT ▾</button>
      <div class="dropdown-menu" id="lang-dropdown">
        <div class="dropdown-item" onclick="setLanguage('TT')">Татарча (TT)</div>
        <div class="dropdown-item" onclick="setLanguage('RU')">Русский (RU)</div>
      </div>

      <!-- Выбор темы -->
      <button class="icon-btn" id="theme-menu-toggle" title="Темы">🎨</button>
      <div class="dropdown-menu" id="theme-dropdown">
        <div class="dropdown-item" onclick="setTheme('beige')" id="th-beige">аксыл-көрән</div>
        <div class="dropdown-item" onclick="setTheme('pastel')" id="th-pastel">ачык күк</div>
        <div class="dropdown-item" onclick="setTheme('mint')" id="th-mint">бөтнек</div>
        <div class="dropdown-item" onclick="setTheme('hitech')" id="th-hitech">хай-тек</div>
        <div class="dropdown-item" onclick="setTheme('dark')" id="th-dark">кара урман</div>
      </div>
    </div>
  </div>

  <!-- Адрес комнаты -->
  <div class="room-bar">
    <span style="font-size: 12px; color: #777;" id="lbl-chat">Чат:</span>
    <input type="text" class="room-input" value="mw-1234" id="room-id">
    <button class="btn-action" id="btn-enter">Керү</button>
  </div>

  <!-- Окно сообщений -->
  <div class="messages-area" id="messages-container">
    <div class="message-bubble selectable" onclick="toggleSelect(this)">
      Сәлам! Тәҗрибәне башлыйбызмы?
    </div>
    <div class="message-bubble out selectable" onclick="toggleSelect(this)">
      Әйе, барысы да әзер!
      <img src="https://via.placeholder.com/150/a07855/ffffff?text=Photo+1" class="message-img">
    </div>
  </div>

  <!-- Панель выделенных объектов -->
  <div class="batch-actions-bar" id="batch-bar">
    <span id="selected-count" style="font-size: 12px;">Сайланды: 0</span>
    <div style="display: flex; gap: 6px;">
      <button class="nav-btn" onclick="shareSelected()" style="background: #25D366; color: white;">Переслать (WhatsApp/TG)</button>
      <button class="btn-action" onclick="saveSelectedPack()">Саклау (Кучка белән)</button>
    </div>
  </div>

  <!-- Ввод сообщения -->
  <div class="input-bar">
    <button class="icon-btn" id="btn-multi-select" onclick="toggleSelectMode()" title="Выбрать несколько">☑️</button>
    <button class="icon-btn" title="Картинка" onclick="addImageMsg()">🖼️</button>
    <button class="icon-btn" title="Голосовое">🎙️</button>
    <input type="text" class="chat-input" placeholder="Хәбәр языгыз..." id="msg-input">
    <button class="send-btn" onclick="sendMessage()">➔</button>
  </div>
</div>

<script>
  let currentLang = 'TT';
  let isSelectMode = false;

  // Словарь с полной татарской графикой (Ә, Ө, Ү, Җ, Ң, Һ)
  const dict = {
    TT: {
      trader: "Трейдер",
      chats: "Чатлар",
      notes: "Язмалар",
      enter: "Керү",
      placeholder: "Хәбәр языгыз...",
      chatLbl: "Чат:",
      thBeige: "аксыл-көрән",
      thPastel: "ачык күк",
      thMint: "бөтнек",
      thHitech: "хай-тек",
      thDark: "кара урман"
    },
    RU: {
      trader: "Трейдер",
      chats: "Чаты",
      notes: "Заметки",
      enter: "Войти",
      placeholder: "Напишите сообщение...",
      chatLbl: "Чат:",
      thBeige: "Бежевый",
      thPastel: "Пастельно-голубой",
      thMint: "Мятный",
      thHitech: "Хай-тек",
      thDark: "Темный лес"
    }
  };

  // Переключение меню
  document.getElementById('lang-toggle').onclick = (e) => { e.stopPropagation(); toggleDropdown('lang-dropdown'); };
  document.getElementById('theme-menu-toggle').onclick = (e) => { e.stopPropagation(); toggleDropdown('theme-dropdown'); };
  document.getElementById('sound-menu-toggle').onclick = (e) => { e.stopPropagation(); toggleDropdown('sound-dropdown'); };

  function toggleDropdown(id) {
    document.querySelectorAll('.dropdown-menu').forEach(m => {
      if (m.id !== id) m.classList.remove('show');
    });
    document.getElementById(id).classList.toggle('show');
  }

  document.addEventListener('click', () => {
    document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
  });

  // Переключение языка
  function setLanguage(lang) {
    currentLang = lang;
    document.getElementById('lang-toggle').innerText = lang + ' ▾';
    
    const d = dict[lang];
    document.getElementById('btn-trader').innerText = d.trader;
    document.getElementById('btn-chats').innerText = d.chats;
    document.getElementById('btn-notes').innerText = d.notes;
    document.getElementById('btn-enter').innerText = d.enter;
    document.getElementById('msg-input').placeholder = d.placeholder;
    document.getElementById('lbl-chat').innerText = d.chatLbl;

    document.getElementById('th-beige').innerText = d.thBeige;
    document.getElementById('th-pastel').innerText = d.thPastel;
    document.getElementById('th-mint').innerText = d.thMint;
    document.getElementById('th-hitech').innerText = d.thHitech;
    document.getElementById('th-dark').innerText = d.thDark;
  }

  // Установка тем
  function setTheme(theme) {
    document.body.className = '';
    if (theme === 'dark') document.body.classList.add('theme-dark');
  }

  // Звуки
  function setSound(type) {
    if (type !== 'mute') {
      alert("Звуковой режим установлен: " + type);
    }
  }

  // Отправка сообщений
  function sendMessage() {
    const input = document.getElementById('msg-input');
    if (!input.value.trim()) return;

    const msg = document.createElement('div');
    msg.className = 'message-bubble out selectable';
    msg.innerText = input.value;
    msg.onclick = function() { toggleSelect(this); };

    document.getElementById('messages-container').appendChild(msg);
    input.value = '';
    msg.scrollIntoView({ behavior: 'smooth' });
  }

  function addImageMsg() {
    const msg = document.createElement('div');
    msg.className = 'message-bubble out selectable';
    msg.innerHTML = `Фото:<img src="https://via.placeholder.com/150/8b5e3c/ffffff?text=Cat+Photo" class="message-img">`;
    msg.onclick = function() { toggleSelect(this); };
    document.getElementById('messages-container').appendChild(msg);
    msg.scrollIntoView({ behavior: 'smooth' });
  }

  // Выделение нескольких
  function toggleSelectMode() {
    isSelectMode = !isSelectMode;
    document.getElementById('btn-multi-select').style.background = isSelectMode ? '#a07855' : '#f5f0eb';
    document.getElementById('btn-multi-select').style.color = isSelectMode ? '#fff' : '#000';
    if (!isSelectMode) clearSelections();
  }

  function toggleSelect(el) {
    if (!isSelectMode) return;
    el.classList.toggle('selected');
    updateBatchBar();
  }

  function updateBatchBar() {
    const selected = document.querySelectorAll('.message-bubble.selected');
    const bar = document.getElementById('batch-bar');
    if (selected.length > 0) {
      bar.classList.add('show');
      document.getElementById('selected-count').innerText = `Сайланды: ${selected.length}`;
    } else {
      bar.classList.remove('show');
    }
  }

  function clearSelections() {
    document.querySelectorAll('.message-bubble.selected').forEach(el => el.classList.remove('selected'));
    updateBatchBar();
  }

  // Пересылка (WhatsApp / Telegram)
  function shareSelected() {
    const selected = document.querySelectorAll('.message-bubble.selected');
    let textToShare = "";
    selected.forEach(el => {
      textToShare += el.innerText + "\n";
    });

    if (navigator.share) {
      navigator.share({
        title: 'Meow Whisper Chat',
        text: textToShare
      }).catch(err => console.log('Ошибка отправки:', err));
    } else {
      alert("Пересылка в внешние мессенджеры:\n\n" + textToShare);
    }
  }

  // Сохранение пачкой
  function saveSelectedPack() {
    const selected = document.querySelectorAll('.message-bubble.selected');
    alert(`Сакланды! (${selected.length} элементы сохранены кучкой)`);
    clearSelections();
  }
</script>
</body>
</html>
