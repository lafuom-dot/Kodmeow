<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meow Whisper 6.0</title>
  <style>
    :root {
      --bg-color: #fdf6e3;
      --accent-color: #e6c594;
      --text-color: #4a3b32;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Шапка приложения */
    header {
      background: var(--accent-color);
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    #user-id-display {
      font-size: 0.9em;
      opacity: 0.8;
    }

    /* Область сообщений */
    #chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 70%;
      padding: 8px 12px;
      border-radius: 12px;
      word-wrap: break-word;
    }

    .message.my {
      align-self: flex-end;
      background: #e2f0d9;
    }

    .message.other {
      align-self: flex-start;
      background: #ffffff;
      border: 1px solid #ddd;
    }

    /* Панель ввода */
    footer {
      padding: 10px;
      display: flex;
      gap: 10px;
      background: #fff;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    button {
      padding: 10px 15px;
      background: var(--accent-color);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <span>🐾 Meow Whisper v6.0</span>
    <span id="user-id-display">Загрузка...</span>
  </header>

  <div id="chat-box"></div>

  <footer>
    <input type="text" id="msg-input" placeholder="Напишите сообщение..." />
    <button id="send-btn">Отправить</button>
  </footer>

  <!-- Firebase v10 Модуль -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Конфигурация Firebase
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "meow-whisper.firebaseapp.com",
      databaseURL: "https://meow-whisper-default-rtdb.firebaseio.com",
      projectId: "meow-whisper",
      storageBucket: "meow-whisper.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    // Инициализация
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Генерация ID пользователя (mw-XXXXXX)
    let myId = localStorage.getItem('mw_user_id');
    if (!myId) {
      myId = 'mw-' + Math.floor(100000 + Math.random() * 900000);
      localStorage.setItem('mw_user_id', myId);
    }
    document.getElementById('user-id-display').textContent = myId;

    // Ссылка на общий чат
    const chatRef = ref(db, 'chats/global/messages');

    // Отправка сообщения
    function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      push(chatRef, {
        sender: myId,
        text: text,
        timestamp: serverTimestamp()
      });

      input.value = '';
    }

    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('msg-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Отрисовка сообщений и звук "мяу"
    const chatBox = document.getElementById('chat-box');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playMeowSound() {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {
        console.log("Аудио заблокировано до клика");
      }
    }

    onChildAdded(chatRef, (snapshot) => {
      const data = snapshot.val();
      const msgDiv = document.createElement('div');
      
      const isMy = data.sender === myId;
      msgDiv.className = `message ${isMy ? 'my' : 'other'}`;
      msgDiv.textContent = `${isMy ? 'Вы' : data.sender}: ${data.text}`;
      
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      // Воспроизводить звук только на входящие сообщения
      if (!isMy) {
        playMeowSound();
      }
    });
  </script>
</body>
</html>
