<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meow Whisper Chat</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4efe9;
      color: #4a3b32;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 450px;
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .header {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .card {
      background: #faf6f0;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .btn {
      background-color: #8c5a47;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 8px;
    }
    .btn:active { opacity: 0.9; }
    .btn-secondary {
      background-color: #d9c5b2;
      color: #4a3b32;
    }
    /* Модальное окно сканера */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      width: 85%;
      max-width: 320px;
    }
    #preview {
      width: 100%;
      height: 220px;
      background: #000;
      border-radius: 10px;
      margin-top: 10px;
      object-fit: cover;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">🐾 Meow Whisper</div>

  <div class="card">
    <div>Мой ID: <strong id="my-id">mw-8842</strong></div>
    <button class="btn" onclick="copyInviteLink()">📋 Скопировать ссылку для друга</button>
    <button class="btn btn-secondary" onclick="openScanner()">📷 Открыть сканер QR</button>
  </div>

  <div id="status" style="text-align:center; font-size: 14px; color: #7a6b60;">
    Готов к подключению
  </div>
</div>

<!-- Модальное окно для QR-сканера -->
<div id="qr-modal" class="modal">
  <div class="modal-content">
    <h3>Сканер QR-кода</h3>
    <video id="preview" autoplay playsinline></video>
    <button class="btn btn-secondary" onclick="closeScanner()" style="margin-top:12px;">Закрыть</button>
  </div>
</div>

<script>
  // 1. Генерация ссылки собеседнику
  const myId = "mw-" + Math.floor(1000 + Math.random() * 9000);
  document.getElementById('my-id').innerText = myId;

  function copyInviteLink() {
    // Формируем ссылку с ID вашей комнаты
    const inviteUrl = window.location.origin + window.location.pathname + '?room=' + myId;
    
    navigator.clipboard.writeText(inviteUrl).then(() => {
      alert("Ссылка скопирована! Отправьте её собеседнику:\n" + inviteUrl);
    }).catch(() => {
      prompt("Скопируйте ссылку вручную:", inviteUrl);
    });
  }

  // Проверка: перешел ли собеседник по ссылке
  const urlParams = new URLSearchParams(window.location.search);
  const targetRoom = urlParams.get('room');
  if (targetRoom) {
    document.getElementById('status').innerText = "Подключение к комнате: " + targetRoom;
  }

  // 2. Встроенная работа с камерой (Сканер)
  let videoStream = null;

  async function openScanner() {
    const modal = document.getElementById('qr-modal');
    const video = document.getElementById('preview');
    modal.style.display = 'flex';

    try {
      // Запуск камеры устройства
      videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = videoStream;
    } catch (err) {
      alert("Не удалось открыть камеру. Убедитесь, что дали разрешение на доступ к камере в браузере.");
      closeScanner();
    }
  }

  function closeScanner() {
    const modal = document.getElementById('qr-modal');
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
    }
    modal.style.display = 'none';
  }
</script>

</body>
</html>
