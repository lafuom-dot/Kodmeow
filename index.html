<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow Whisper Chat v7.0</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <!-- QR Code & Scanner -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-color: #f7f3ee;
            --main-color: #9e6d47;
            --main-hover: #825735;
            --chat-bg: #ffffff;
            --my-msg-bg: #f3e9df;
            --other-msg-bg: #f8f9fa;
            --text-color: #2c2a29;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(158, 109, 71, 0.12);
        }

        body.theme-beige { --bg-color: #f7f3ee; --main-color: #9e6d47; --main-hover: #825735; --chat-bg: #ffffff; --my-msg-bg: #f3e9df; --other-msg-bg: #f8f9fa; --text-color: #2c2a29; }
        body.theme-pastel-blue { --bg-color: #f0f4f8; --main-color: #4a7c59; --main-hover: #3b6346; --chat-bg: #ffffff; --my-msg-bg: #e2ede4; --other-msg-bg: #f8f9fa; --text-color: #1e2923; }
        body.theme-mint { --bg-color: #f2f7f4; --main-color: #3d8b7a; --main-hover: #2f6e61; --chat-bg: #ffffff; --my-msg-bg: #dff2ed; --other-msg-bg: #f8f9fa; --text-color: #1a332d; }
        body.theme-hitech { --bg-color: #f1f3f5; --main-color: #495057; --main-hover: #343a40; --chat-bg: #ffffff; --my-msg-bg: #e9ecef; --other-msg-bg: #f8f9fa; --text-color: #212529; }
        body.theme-dark-forest { --bg-color: #121816; --main-color: #2d5a45; --main-hover: #3a7359; --chat-bg: #1a2320; --my-msg-bg: #274235; --other-msg-bg: #222d29; --text-color: #e6ede9; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; height: 100vh; transition: background 0.3s ease; }
        
        .app-container { width: 100%; max-width: 460px; height: 94vh; background: var(--chat-bg); display: flex; flex-direction: column; border-radius: 28px; box-shadow: var(--shadow-md); overflow: hidden; position: relative; border: 1px solid rgba(0,0,0,0.05); }
        
        /* Верхняя панель */
        .header { background: var(--chat-bg); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid rgba(0,0,0,0.06); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        
        .avatar-wrap { position: relative; cursor: pointer; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--my-msg-bg); color: var(--main-color); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px; border: 2px solid var(--main-color); overflow: hidden; transition: transform 0.2s; }
        .avatar:hover { transform: scale(1.05); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-badge { position: absolute; bottom: -2px; right: -2px; background: var(--main-color); color: #fff; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }

        .nickname-input { background: rgba(0,0,0,0.04); border: 1px solid transparent; color: var(--text-color); padding: 6px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; width: 100px; outline: none; transition: all 0.2s; }
        .nickname-input:focus { border-color: var(--main-color); background: #fff; }

        .controls { display: flex; gap: 6px; align-items: center; }
        select, .btn-icon { padding: 6px 10px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.08); background: rgba(0,0,0,0.02); font-size: 12px; cursor: pointer; outline: none; color: var(--text-color); transition: all 0.2s; font-weight: 500; }
        select:hover, .btn-icon:hover { background: rgba(0,0,0,0.06); }

        .id-bar { font-size: 12px; background: rgba(0,0,0,0.03); padding: 6px 6px 6px 12px; border-radius: 16px; display: flex; gap: 8px; align-items: center; }
        .id-bar input { border: none; background: transparent; flex: 1; outline: none; font-size: 13px; color: var(--text-color); font-weight: 500; }
        .btn-main { background: var(--main-color); color: #fff; font-weight: 600; padding: 7px 14px; border-radius: 12px; border: none; cursor: pointer; transition: background 0.2s; }
        .btn-main:hover { background: var(--main-hover); }

        /* Обои и список сообщений */
        .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background-color: var(--chat-bg); background-image: radial-gradient(rgba(0,0,0,0.03) 1px, transparent 0); background-size: 16px 16px; }
        
        .msg-row { display: flex; gap: 8px; align-items: flex-end; width: 100%; }
        .msg-row.my { justify-content: flex-end; }
        
        .msg-checkbox { display: none; margin-right: 4px; cursor: pointer; accent-color: var(--main-color); }
        .select-mode .msg-checkbox { display: inline-block; }

        .msg { max-width: 78%; padding: 10px 14px; border-radius: 20px; font-size: 13.5px; line-height: 1.45; word-wrap: break-word; box-shadow: var(--shadow-sm); position: relative; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.1s; }
        .msg:active { transform: scale(0.99); }
        .msg.my { background: var(--my-msg-bg); border-bottom-right-radius: 4px; }
        .msg.other { background: var(--other-msg-bg); border-bottom-left-radius: 4px; border: 1px solid rgba(0,0,0,0.04); }
        
        .sender-nickname { font-size: 11px; font-weight: 700; color: var(--main-color); margin-bottom: 3px; }
        .reply-quote { background: rgba(0,0,0,0.05); border-left: 3px solid var(--main-color); padding: 4px 8px; font-size: 11px; margin-bottom: 6px; border-radius: 6px; opacity: 0.85; }

        .msg img { max-width: 100%; border-radius: 12px; margin-top: 4px; }
        .msg audio { max-width: 210px; margin-top: 4px; }
        
        .msg-footer { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 4px; align-self: flex-end; }
        .msg-time { font-size: 10px; opacity: 0.55; font-weight: 500; }
        .msg-status { font-size: 11px; font-weight: bold; opacity: 0.5; }
        .msg-status.read { color: #2b93d1; opacity: 1; }

        .reply-preview { display: none; background: rgba(0,0,0,0.03); padding: 8px 14px; font-size: 12px; border-left: 4px solid var(--main-color); justify-content: space-between; align-items: center; }
        .reply-preview button { background: none; border: none; font-weight: bold; color: #888; cursor: pointer; }

        .multi-delete-bar { display: none; background: #fff1f1; padding: 8px 16px; justify-content: space-between; align-items: center; border-top: 1px solid #ffe0e0; }
        .multi-delete-bar button { background: #e63946; color: white; border: none; padding: 6px 12px; border-radius: 10px; font-weight: 600; font-size: 12px; cursor: pointer; }

        /* Футер ввода */
        .footer { display: flex; padding: 10px 12px; background: var(--chat-bg); border-top: 1px solid rgba(0,0,0,0.06); gap: 8px; align-items: center; }
        .footer input[type="text"] { flex: 1; padding: 10px 16px; border: 1px solid rgba(0,0,0,0.08); border-radius: 20px; outline: none; font-size: 13.5px; background: rgba(0,0,0,0.02); color: var(--text-color); transition: border 0.2s; }
        .footer input[type="text"]:focus { border-color: var(--main-color); background: #fff; }
        
        .action-btn { background: rgba(0,0,0,0.04); color: var(--text-color); border: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; }
        .action-btn:hover { background: rgba(0,0,0,0.08); }
        .action-btn.recording { background: #e63946; color: white; animation: pulse 1s infinite; }
        .send-btn { background: var(--main-color); color: white; border: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; }
        .send-btn:hover { background: var(--main-hover); }

        /* Векторные Иконки SVG */
        .icon-svg { width: 18px; height: 18px; fill: currentColor; }

        /* Модальные окна */
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: var(--chat-bg); color: var(--text-color); width: 88%; max-width: 360px; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-md); max-height: 80vh; overflow-y: auto; }
        .modal-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; border-bottom: 1px solid rgba(0,0,0,0.06); padding-bottom: 8px; }
        .chat-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: rgba(0,0,0,0.03); border-radius: 12px; cursor: pointer; transition: background 0.2s; }
        .chat-item:hover { background: rgba(0,0,0,0.06); }
        .btn-del-chat { background: #e63946; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; }

        .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 8px; }
        .avatar-option { width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,0.04); display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
        .avatar-option:hover { border-color: var(--main-color); transform: scale(1.08); }

        .msg-menu-btn { padding: 10px 14px; background: rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); border-radius: 12px; text-align: left; font-size: 13px; font-weight: 500; display: flex; gap: 10px; align-items: center; color: var(--text-color); cursor: pointer; transition: background 0.2s; }
        .msg-menu-btn:hover { background: rgba(0,0,0,0.06); }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="theme-beige">

<div class="app-container">
    <div class="header">
        <div class="top-bar">
            <div class="user-info">
                <div class="avatar-wrap" onclick="openAvatarModal()" title="Сменить аватар">
                    <div class="avatar" id="myAvatar">🐱</div>
                    <div class="avatar-badge">✏️</div>
                </div>
                <input type="text" class="nickname-input" id="nicknameInput" value="Котик" onchange="updateNickname()" title="Ваш никнейм">
            </div>
            <div class="controls">
                <button class="btn-icon" onclick="toggleChatsModal()" id="btnSavedChats">Чаты</button>
                <button class="btn-icon" onclick="toggleKittensModal()" id="btnMyKittens">Заметки</button>
                <button class="btn-icon" onclick="openQRModal()" title="QR Код">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 3h8v8H3zm2 2v4h4V5zm8-2h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zm13-2h3v2h-3zm-3 0h2v3h-2zm3 3h3v5h-3zm-3 2h2v3h-2zm-2-2h2v2h-2z"/></svg>
                </button>
                <select id="langSelect" onchange="changeLanguage()">
                    <option value="ru">RU</option>
                    <option value="en">EN</option>
                    <option value="tr">TR</option>
                    <option value="tt">TT</option>
                    <option value="ar">AR</option>
                </select>
                <select id="themeSelect" onchange="changeTheme()">
                    <option value="theme-beige" id="optThemeBeige">Бежевый</option>
                    <option value="theme-pastel-blue" id="optThemeBlue">Пастельный</option>
                    <option value="theme-mint" id="optThemeMint">Мятный</option>
                    <option value="theme-hitech" id="optThemeHitech">Хай-тек</option>
                    <option value="theme-dark-forest" id="optThemeDarkForest">Тёмный</option>
                </select>
                <select id="soundSelect" onchange="demoSound()">
                    <option value="meow" id="optSoundMeow">Мяу</option>
                    <option value="crunch" id="optSoundCrunch">Хруст</option>
                    <option value="hiss" id="optSoundHiss">Шипенье</option>
                </select>
            </div>
        </div>
        <div class="id-bar">
            <span id="labelPartner" style="opacity:0.6;">Чат с:</span>
            <input type="text" id="partnerIdInput" placeholder="mw-1234">
            <button class="btn-main" onclick="connectToChatFromInput()" id="btnConnect">Войти</button>
        </div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="reply-preview" id="replyPreview">
        <span id="replyText">Ответ на...</span>
        <button onclick="cancelReply()">✕</button>
    </div>

    <div class="multi-delete-bar" id="multiDeleteBar">
        <span id="selectedCount">Выбрано: 0</span>
        <div>
            <button onclick="deleteSelectedMessages()" id="btnConfirmMultiDelete">🗑️ Удалить</button>
            <button onclick="toggleSelectMode(false)" style="background: #888; margin-left: 4px;" id="btnCancelSelect">Отмена</button>
        </div>
    </div>

    <div class="footer">
        <button class="action-btn" onclick="toggleSelectMode(true)" title="Выбрать несколько" id="btnSelectMode">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
        </button>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
        <button class="action-btn" onclick="document.getElementById('imageInput').click()" title="Отправить фото">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        </button>
        <button class="action-btn" id="recordBtn" onclick="toggleRecord()" title="Голосовое">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
        </button>
        
        <input type="text" id="messageInput" placeholder="Напишите сообщение...">
        <button class="send-btn" onclick="sendMessage()">
            <svg class="icon-svg" style="fill:#fff; transform: rotate(45deg); margin-left:-2px;" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>

    <!-- Модалка выбора аватарки -->
    <div class="modal" id="avatarModal">
        <div class="modal-content">
            <div class="modal-title" id="titleAvatar">Выберите аватар</div>
            <input type="file" id="avatarFileInput" accept="image/*" style="display: none;" onchange="uploadCustomAvatar(event)">
            <button class="btn-main" onclick="document.getElementById('avatarFileInput').click()" id="btnUploadPhoto">📷 Загрузить своё фото</button>
            <div style="font-size: 12px; opacity:0.6; text-align:center; margin-top:4px;" id="lblOrChoose">Или выберите котика:</div>
            <div class="avatar-grid">
                <div class="avatar-option" onclick="selectPresetAvatar('🐱')">🐱</div>
                <div class="avatar-option" onclick="selectPresetAvatar('😺')">😺</div>
                <div class="avatar-option" onclick="selectPresetAvatar('😻')">😻</div>
                <div class="avatar-option" onclick="selectPresetAvatar('😼')">😼</div>
                <div class="avatar-option" onclick="selectPresetAvatar('😾')">😾</div>
                <div class="avatar-option" onclick="selectPresetAvatar('🐈‍⬛')">🐈‍⬛</div>
                <div class="avatar-option" onclick="selectPresetAvatar('🐾')">🐾</div>
                <div class="avatar-option" onclick="selectPresetAvatar('🦁')">🦁</div>
            </div>
            <button onclick="closeAvatarModal()" style="margin-top: 10px; padding: 8px;" id="btnCloseAvatar">Закрыть</button>
        </div>
    </div>

    <!-- Модалка сохраненных чатов -->
    <div class="modal" id="chatsModal">
        <div class="modal-content">
            <div class="modal-title" id="titleSavedChats">Сохраненные чаты</div>
            <div id="chatsList" style="display: flex; flex-direction: column; gap: 6px;"></div>
            <button onclick="toggleChatsModal()" style="margin-top: 10px; padding: 8px;" id="btnCloseChats">Закрыть</button>
        </div>
    </div>

    <!-- Модалка Блокнот Мои котята -->
    <div class="modal" id="kittensModal">
        <div class="modal-content">
            <div class="modal-title" id="titleKittens">🐾 Мои котята (Заметки)</div>
            <div id="kittensList" style="display: flex; flex-direction: column; gap: 6px;"></div>
            <button onclick="toggleKittensModal()" style="margin-top: 10px; padding: 8px;" id="btnCloseKittens">Закрыть</button>
        </div>
    </div>

    <!-- Модалка QR Кода -->
    <div class="modal" id="qrModal">
        <div class="modal-content" style="align-items: center; text-align: center;">
            <div class="modal-title" id="titleQR">Мой QR Код / Сканер</div>
            <div id="qrcode" style="margin: 10px auto;"></div>
            <div id="qr-reader" style="width: 100%; display: none;"></div>
            <button onclick="startQRScanner()" id="btnStartScan" class="btn-main" style="width: 100%;">📷 Сканировать QR друга</button>
            <button onclick="closeQRModal()" style="margin-top: 6px; width: 100%; padding: 8px;" id="btnCloseQR">Закрыть</button>
        </div>
    </div>

    <!-- Модалка контекстного меню сообщения -->
    <div class="modal" id="msgMenuModal">
        <div class="modal-content">
            <div class="modal-title" id="titleMsgMenu">Действие с сообщением</div>
            <button class="msg-menu-btn" onclick="actionReply()" id="mReply">↩️ Ответить</button>
            <button class="msg-menu-btn" onclick="actionCopy()" id="mCopy">📋 Копировать текст</button>
            <button class="msg-menu-btn" onclick="actionForward()" id="mForward">↗️ Переслать</button>
            <button class="msg-menu-btn" onclick="actionSaveKittens()" id="mSave">🐾 В "Мои котята"</button>
            <button class="msg-menu-btn" onclick="actionDelete()" id="mDelete" style="color: #e63946;">🗑️ Удалить</button>
            <button onclick="closeMsgMenu()" style="margin-top: 6px; padding: 8px;" id="mCancel">Отмена</button>
        </div>
    </div>
</div>

    function uploadCustomAvatar(e) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = 120; canvas.height = 120;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, 120, 120);
                myAvatarData = canvas.toDataURL('image/jpeg', 0.8);
                localStorage.setItem('mw_avatar', myAvatarData);

        }

    // Звуки
    function playSound(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (type === 'meow') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(750, ctx.currentTime + 0.15);
                osc.frequency.exponentialRampToValueAtTime(320, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } else if (type === 'crunch') {
                const bufferSize = ctx.sampleRate * 0.15;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass'; filter.frequency.value = 3000;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
                noise.start();
            } else if (type === 'hiss') {
                const bufferSize = ctx.sampleRate * 0.3;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'highpass'; filter.frequency.value = 4000;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.25, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
                noise.start();
            }
        } catch(e) {}
    }

    function getSavedChats() { return JSON.parse(localStorage.getItem('mw_saved_chats') || '[]'); }
    function saveChatToList(partnerId) {
        let chats = getSavedChats();
        if (!chats.includes(partnerId)) { chats.push(partnerId); localStorage.setItem('mw_saved_chats', JSON.stringify(chats)); }
    }
    function removeChatFromList(partnerId, e) {
        e.stopPropagation();
        let chats = getSavedChats().filter(id => id !== partnerId);
        localStorage.setItem('mw_saved_chats', JSON.stringify(chats));
        renderChatsList();
    }

    function renderChatsList() {
        const listDiv = document.getElementById('chatsList');
        const chats = getSavedChats();
        const lang = document.getElementById('langSelect').value;
        listDiv.innerHTML = '';

        if (chats.length === 0) {
            listDiv.innerHTML = `<span style="font-size:12px; opacity:0.6;">${i18n[lang].noChats}</span>`;
            return;
        }

        chats.forEach(partnerId => {
            const item = document.createElement('div');
            item.className = 'chat-item';
            item.innerHTML = `<span>🐾 ${partnerId}</span> <button class="btn-del-chat" onclick="removeChatFromList('${partnerId}', event)">✕</button>`;
            item.onclick = () => { openChat(partnerId); toggleChatsModal(); };
            listDiv.appendChild(item);
        });
    }

    function toggleChatsModal() {

    function connectToChatFromInput() {
        const partnerId = document.getElementById('partnerIdInput').value.trim();
        if (!partnerId) return alert('Введите ID друга!');
        openChat(partnerId);
    }

    function openChat(partnerId) {
        currentPartnerId = partnerId;
        document.getElementById('partnerIdInput').value = partnerId;
        saveChatToList(partnerId);

        currentChatId = [myId, partnerId].sort().join('_');
        const chatRef = db.ref('chats/' + currentChatId + '/messages');
        chatRef.off();

        document.getElementById('chatBox').innerHTML = '';
        
        chatRef.on('child_added', (snapshot) => {
            const data = snapshot.val();
            const key = snapshot.key;

            if (data.sender !== myId && !data.read) {
                db.ref('chats/' + currentChatId + '/messages/' + key).update({ read: true });
            }

            displayMessage(data, key, data.sender === myId ? 'my' : 'other');
        });

        chatRef.on('child_changed', (snapshot) => {
            const data = snapshot.val();
            const key = snapshot.key;
            const statusSpan = document.getElementById('status_' + key);
            if (statusSpan && data.read) {
                statusSpan.innerText = '✓✓';
                statusSpan.classList.add('read');
            }
        });
    }

    function sendMessage(content = null, type = 'text') {
        if (!currentChatId) return alert('Сначала выберите или введите ID друга!');

        let textVal = content;
        if (type === 'text') {
            const input = document.getElementById('messageInput');
            textVal = input.value.trim();
            if (!textVal) return;
            input.value = '';
        }

        const msgData = {
            sender: myId,
            senderNick: myNickname,
            type: type,
            content: textVal,
            timestamp: Date.now(),
            read: false
        };

        if (replyToData) {
            msgData.replyTo = replyToData.type === 'text' ? replyToData.content : 'Медиа файл';
            cancelReply();
        }

        db.ref('chats/' + currentChatId + '/messages').push(msgData);
        playSound(document.getElementById('soundSelect').value);
    }

    function displayMessage(data, key, side) {
        const chatBox = document.getElementById('chatBox');
        
        const row = document.createElement('div');
        row.className = `msg-row ${side}`;
        row.id = 'row_' + key;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'msg-checkbox';
        checkbox.value = key;
        checkbox.onchange = updateSelectedCount;
        row.appendChild(checkbox);

        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${side}`;
        msgDiv.onclick = () => {
            if (isSelectMode) {
                checkbox.checked = !checkbox.checked;
                updateSelectedCount();
            } else {
                openMsgMenu(data, key);
            }
        };

        if (data.senderNick) {
            const nickSpan = document.createElement('div');
            nickSpan.className = 'sender-nickname';
            nickSpan.innerText = data.senderNick;
            msgDiv.appendChild(nickSpan);
        }

        if (data.replyTo) {
            const replyDiv = document.createElement('div');
            replyDiv.className = 'reply-quote';
            replyDiv.innerText = '↩️ ' + data.replyTo;
            msgDiv.appendChild(replyDiv);
        }
        
        if (data.type === 'image') {
            const img = document.createElement('img');
            img.src = data.content;
            msgDiv.appendChild(img);
        } else if (data.type === 'audio') {
            const audio = document.createElement('audio');
            audio.controls = true;
            audio.src = data.content;
            msgDiv.appendChild(audio);
        } else {
            const textSpan = document.createElement('span');
            textSpan.innerText = data.content;
            msgDiv.appendChild(textSpan);
        }
        
        const footer = document.createElement('div');
        footer.className = 'msg-footer';

        const timeSpan = document.createElement('span');
        timeSpan.className = 'msg-time';
        const date = data.timestamp ? new Date(data.timestamp) : new Date();
        timeSpan.innerText = `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
        footer.appendChild(timeSpan);

        if (side === 'my') {
            const statusSpan = document.createElement('span');
            statusSpan.className = `msg-status ${data.read ? 'read' : ''}`;
            statusSpan.id = 'status_' + key;
            statusSpan.innerText = data.read ? '✓✓' : '✓';
            footer.appendChild(statusSpan);
        }

        msgDiv.appendChild(footer);
        row.appendChild(msgDiv);
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function toggleSelectMode(enable) {
        isSelectMode = enable;
        const chatBox = document.getElementById('chatBox');
        const bar = document.getElementById('multiDeleteBar');
        if (enable) {
            chatBox.classList.add('select-mode');
            bar.style.display = 'flex';
        } else {
            chatBox.classList.remove('select-mode');
            bar.style.display = 'none';
            document.querySelectorAll('.msg-checkbox').forEach(cb => cb.checked = false);
        }
        updateSelectedCount();
    }

    function updateSelectedCount() {
        const count = document.querySelectorAll('.msg-checkbox:checked').length;
        document.getElementById('selectedCount').innerText = 'Выбрано: ' + count;

    function deleteSelectedMessages() {
        const selected = Array.from(document.querySelectorAll('.msg-checkbox:checked')).map(cb => cb.value);
        if (selected.length === 0) return alert('Ничего не выбрано!');
        
        if (confirm(`Удалить выбранные сообщения (${selected.length} шт.)?`)) {
            selected.forEach(key => {
                db.ref('chats/' + currentChatId + '/messages/' + key).remove();
            });
            toggleSelectMode(false);
            openChat(currentPartnerId);
        }
    }

    function actionReply() {

    function actionCopy() {
        if (selectedMsgData.type === 'text') { navigator.clipboard.writeText(selectedMsgData.content); alert('Текст скопирован!'); }

    function actionForward() {
        const chats = getSavedChats();
        if (chats.length === 0) return alert('У вас нет других сохраненных чатов!');
        const targetId = prompt('Кому переслать?\n' + chats.join(', '));

            const targetChatId = [myId, targetId.trim()].sort().join('_');
            db.ref('chats/' + targetChatId + '/messages').push({
                sender: myId, senderNick: myNickname, type: selectedMsgData.type, content: selectedMsgData.content, timestamp: Date.now(), read: false, replyTo: 'Переслано'

            alert('Переслано!');
        }
        closeMsgMenu();
    }

    function actionSaveKittens() {
        let kittens = JSON.parse(localStorage.getItem('mw_my_kittens') || '[]');
        kittens.push({ content: selectedMsgData.content, type: selectedMsgData.type, date: new Date().toLocaleDateString() });
        localStorage.setItem('mw_my_kittens', JSON.stringify(kittens));
        alert('Сохранено в "Мои котята" 🐾');
        closeMsgMenu();
    }

    function actionDelete() {
        if (confirm('Удалить сообщение?')) {
            if (currentChatId && selectedMsgKey) {
                db.ref('chats/' + currentChatId + '/messages/' + selectedMsgKey).remove();
                openChat(currentPartnerId);
            }
        }
        closeMsgMenu();
    }

    function openQRModal() {
        document.getElementById('qrModal').style.display = 'flex';

    }

    function startQRScanner() {
        document.getElementById('qr-reader').style.display = 'block';
        html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: 200 });
        html5QrcodeScanner.render((scannedText) => {
            html5QrcodeScanner.clear();
            document.getElementById('qr-reader').style.display = 'none';
            closeQRModal();
            openChat(scannedText.trim());
        });
    }

    function closeQRModal() {
        if (html5QrcodeScanner) { try { html5QrcodeScanner.clear(); } catch(e){} }
        document.getElementById('qrModal').style.display = 'none';
    }

    function handleImageUpload(e) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const scale = 400 / img.width;
                canvas.width = 400; canvas.height = img.height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                sendMessage(canvas.toDataURL('image/jpeg', 0.6), 'image');
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    }

    let mediaRecorder = null, audioChunks = [], isRecording = false;
    async function toggleRecord() {
        const btn = document.getElementById('recordBtn');
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const reader = new FileReader();
                    reader.onloadend = () => sendMessage(reader.result, 'audio');
                    reader.readAsDataURL(new Blob(audioChunks, { type: 'audio/webm' }));
                };
                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
            } catch (err) { alert('Нет доступа к микрофону!'); }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            btn.classList.remove('recording');
        }
    }

    document.getElementById('messageInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
