<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow Whisper Instant Chat</title>
    <!-- Подключаем библиотеки Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #e7ebb3; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .app-window { width: 100%; max-width: 450px; height: 90vh; background: #fff; display: flex; flex-direction: column; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); overflow: hidden; }
        
        .header { background: #517da2; color: #fff; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .top-row { font-weight: bold; font-size: 16px; text-align: center; }
        .id-bar { font-size: 13px; background: rgba(255,255,255,0.2); padding: 6px 10px; border-radius: 6px; display: flex; gap: 6px; align-items: center; }
        .id-bar input { border: none; padding: 6px 8px; border-radius: 4px; flex: 1; outline: none; }
        .id-bar button { background: #fff; color: #517da2; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        .chat-messages { flex: 1; background: #e7ebb3; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 10px; font-size: 14px; word-wrap: break-word; }
        .msg.my { background: #effedd; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.other { background: #ffffff; align-self: flex-start; border-bottom-left-radius: 2px; }

        .footer { display: flex; padding: 10px; background: #fff; border-top: 1px solid #ddd; gap: 8px; }
        .footer input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        .footer button { background: #517da2; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-window">
    <div class="header">
        <div class="top-row" id="chatTitle">Мой ID: ...</div>
        <div class="id-bar">
            <span>ID друга:</span>
            <input type="text" id="partnerIdInput" placeholder="mw-1234">
            <button onclick="connectToChat()">Войти</button>
        </div>
    </div>

    <div class="chat-messages" id="chatBox"></div>

    <div class="footer">
        <input type="text" id="messageInput" placeholder="Напишите сообщение...">
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    // Точный конфиг с буквой O
    const firebaseConfig = {
        apiKey: "AIzaSyBYP7VgXjs6eovGU8ptQignO8ha_uQCpwQ",
        authDomain: "my-cat-3db92.firebaseapp.com",
        databaseURL: "https://my-cat-3db92-default-rtdb.firebaseio.com",
        projectId: "my-cat-3db92",
        storageBucket: "my-cat-3db92.firebasestorage.app",
        messagingSenderId: "572307984373",
        appId: "1:572307984373:web:afbd346db8c6797b201abc"
    };

    // Инициализация Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Генерация уникального ID пользователя
    let myId = localStorage.getItem('mw_user_id');
    if (!myId) {
        myId = 'mw-' + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('mw_user_id', myId);
    }
    document.getElementById('chatTitle').innerText = 'Мой ID: ' + myId;

    let currentChatId = null;

    // Подключение к комнате
    function connectToChat() {
        const partnerId = document.getElementById('partnerIdInput').value.trim();
        if (!partnerId) {
            alert('Введите ID собеседника!');
            return;
        }

        currentChatId = [myId, partnerId].sort().join('_');

        const chatRef = db.ref('chats/' + currentChatId + '/messages');
        chatRef.off(); 

        document.getElementById('chatBox').innerHTML = '';

        // Прослушивание новых сообщений в реальном времени
        chatRef.on('child_added', (snapshot) => {
            const data = snapshot.val();
            displayMessage(data.text, data.sender === myId ? 'my' : 'other');
        });

        alert('Соединение установлено!');
    }

    // Отправка сообщения в Firebase
    function sendMessage() {
        const textInput = document.getElementById('messageInput');
        const text = textInput.value.trim();

        if (!text) return;
        if (!currentChatId) {
            alert('Сначала введите ID друга и нажмите "Войти"!');
            return;
        }

        db.ref('chats/' + currentChatId + '/messages').push({
            sender: myId,
            text: text,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        });

        textInput.value = '';
    }

    function displayMessage(text, type) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${type}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById('messageInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
